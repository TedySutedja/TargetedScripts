<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TargetedScripts • Tailored code, targeted results.</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vgreen: {
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
            },
            navy: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Typography Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-navy-950 text-slate-100 min-h-screen antialiased flex flex-col justify-between pt-28 selection:bg-vgreen-500 selection:text-black">

  <!-- 1. HEADER MODULAR CONTAINER -->
  <div id="header-root"></div>

  <!-- 2. MAIN MODULAR CONTENT -->
  <main class="flex-grow">
    <div id="hero-root"></div>
    <div id="services-root"></div>
    <div id="portfolio-root"></div>
    <div id="dashboards-root"></div>
    <div id="pricing-root"></div>
    <div id="faq-root"></div>
    <div id="about-root"></div>
    <div id="contact-root"></div>
  </main>

  <!-- 3. FOOTER MODULAR CONTAINER -->
  <div id="footer-root"></div>

  <!-- 4. CORE LOADER SCRIPT -->
  <script src="js/loader.js"></script>

</body>
</html>
